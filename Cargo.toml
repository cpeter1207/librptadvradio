[package]
name = "librptadvradio"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Portable f32 radio-core ABI for rpt_advanced"
repository = "https://github.com/cpeter1207/librptadvradio"
publish = false

[lib]
name = "rptadvradio"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
